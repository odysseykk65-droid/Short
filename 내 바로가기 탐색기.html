<style>.drop-target{outline:2px dashed var(--blue);outline-offset:-3px;background:#e8f2ff!important}#itemList.file-drop-active{outline:3px dashed var(--blue);outline-offset:-6px;background:#f0f7ff}</style>
<style>
.row,.tile,.sideitem,.detail-card,.colhead{zoom:var(--zoom)}
.fav{width:18px;height:18px;object-fit:contain;vertical-align:middle;border-radius:4px}.heroicon .fav{width:54px;height:54px;border-radius:10px}.tileicon .fav{width:30px;height:30px}
.memo-box{white-space:pre-wrap;background:#fff8e1;border:1px solid #ffe3a3;border-radius:8px;padding:10px 12px;font-size:13px;color:#5a4a1a;margin:0 0 14px;text-align:left;overflow-wrap:anywhere}
.field textarea{width:100%;min-height:78px;border:1px solid #d7dee8;border-radius:7px;padding:8px 10px;font:inherit;outline:none;resize:vertical}.field textarea:focus{border-color:var(--blue)}.field small{display:block;color:#b45309;font-size:11px;margin-top:4px}
.qr-wrap{text-align:center}.qr-wrap img{width:min(320px,75vw);height:auto;image-rendering:pixelated;border:1px solid var(--line);border-radius:10px;padding:6px;background:#fff}.qr-name{font-size:18px;font-weight:700;margin:10px 0 2px}.qr-url{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.info-body{font-size:14px;line-height:1.7;color:#344258}.info-body ol{padding-left:20px;margin:6px 0}.info-body .note{font-size:12px;color:var(--muted);background:#f3f7fc;border-radius:7px;padding:8px 10px;margin-top:10px}
.row[draggable=true],.tile[draggable=true]{cursor:grab}.dragging{opacity:.45}.drop-before{box-shadow:inset 0 3px 0 var(--blue)}
.minibtn{height:24px;padding:0 8px;border:1px solid #d7dde5;border-radius:6px;background:#fff;font-size:11px;color:#38465a;cursor:pointer;margin-right:6px}.minibtn:hover{background:#eef4fb}
.footer-center{position:static;transform:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}@media(max-width:1250px){.footer-center{display:none}}.toolbtn.text{padding:0 10px;font-size:13px;font-weight:700}.toolbtn.on{background:var(--blue);color:#fff}
body.present .hint,body.present .sidebar{display:none}body.present .app{max-width:none;margin:0;height:100vh;border-radius:0;border:0}
body.present .main{grid-template-columns:300px 360px minmax(380px,1fr)}body.present .row{height:54px;font-size:19px}body.present .row-icon{font-size:21px;width:26px}body.present .row .fav{width:24px;height:24px}
body.present .detail h2{font-size:30px}body.present .sub{font-size:15px}body.present .heroicon{width:124px;height:124px;font-size:60px}body.present .heroicon .fav{width:72px;height:72px}body.present .info-row{font-size:15px;min-height:46px}body.present .action{height:56px;font-size:18px}body.present .colhead{font-size:15px}body.present .qr-wrap img{width:min(480px,70vh)}
@media(max-width:740px){.main[data-pane="nav"] .sidebar{flex-direction:column}.sideitem{flex:none;height:46px;font-size:15px}.footer{overflow-x:auto;justify-content:flex-start}.footbtn{flex:none}.footer .spacer{display:none}.toolbtn.text{padding:0 7px;font-size:12px}}

<body>
<div class="app">
 <div class="hint">☁️ 파일은 PC와 모바일에서 함께 보이도록 클라우드에 동기화됩니다 · 여러 PPT도 한 번에 추가할 수 있습니다</div>
 <header class="toolbar">
  <div class="win-dots"><i class="dot red"></i><i class="dot yellow"></i><i class="dot green"></i></div>
  <button class="toolbtn" id="backBtn" title="뒤로">‹</button><button class="toolbtn" id="forwardBtn" title="앞으로">›</button>
  <div class="sep"></div><button class="toolbtn" id="listMode" title="목록 보기">▤</button><button class="toolbtn" id="gridMode" title="아이콘 보기">▦</button><button class="toolbtn" id="newFolderBtn" title="새 폴더 만들기">＋📁</button><button class="toolbtn text" id="presentBtn" title="강의(발표) 모드 · Esc로 끝내기">🎤 강의 모드</button>
  <label class="address"><span>🌐</span><input id="addressInput" aria-label="주소" placeholder="사이트 주소를 입력하고 Enter"></label>
  <div class="righttools"><span class="zoom-label">보기</span><button class="viewbtn active" data-zoom="1">보통</button><button class="viewbtn" data-zoom="1.12">크게</button><button class="viewbtn" data-zoom="1.25">아주 크게</button><input class="search" id="searchInput" placeholder="⌕  검색" aria-label="검색"></div>
 </header>
 <main class="main" id="main" data-pane="nav">
  <aside class="sidebar" id="sidebar"></aside>
  <section class="column sites-col"><div class="colhead"><span>폴더 / 사이트 목록</span><b id="siteCount">0개</b></div><div class="list" id="folderList"></div></section>
  <section class="column items-col"><div class="colhead"><span id="itemHeading">내부 항목</span><span><button class="minibtn" id="shareFolderBtn" hidden title="이 폴더의 사이트 링크를 한 번에 공유">🔗 링크 모아 공유</button><b id="itemCount">0개</b></span></div><div class="list" id="itemList"></div></section>
  <section class="detail" id="detail"></section>
 </main>
 <footer class="footer"><button class="footbtn add" id="addSiteBtn">＋ 사이트 추가</button><button class="footbtn" id="addFileBtn">＋ 파일 추가</button><button class="footbtn" id="backupBtn" title="목록 전체를 파일로 저장">💾 백업</button><button class="footbtn" id="restoreBtn" title="백업 파일에서 목록 불러오기">📂 불러오기</button><button class="footbtn" id="installBtn" title="휴대폰 홈 화면에 앱처럼 추가">📲 홈 화면에</button><button class="footbtn" id="resetBtn">기본값 복원</button><span class="spacer"></span><span class="footer-center" id="storageInfo">PC·모바일 자동 동기화</span><span class="spacer"></span><button class="footbtn" id="cancelBtn">취소</button><button class="footbtn open" id="openBtn">열기 ↗</button></footer>
</div>
<input type="file" id="filePicker" multiple hidden><input type="file" id="restorePicker" accept=".json,application/json" hidden>

qrcode.stringToBytes=qrcode.stringToBytesFuncs['UTF-8'];
function qrDataUrl(text){const q=qrcode(0,'M');q.addData(text);q.make();return q.createDataURL(10,2)}
function showQR(x){const url=siteHref(x.url);let src;try{src=qrDataUrl(url)}catch{alert('QR 코드를 만들 수 없는 주소입니다.');return}showInfo('📱 휴대폰 카메라로 찍으세요',`<div class="qr-wrap"><img src="${src}" alt="QR 코드"><div class="qr-name">${esc(x.name)}</div><div class="qr-url">${esc(x.url)}</div></div>`,'<button class="footbtn" id="qrSave">⬇️ QR 저장</button><button class="footbtn" id="qrCopy">🔗 링크 복사</button>');document.getElementById('qrCopy').onclick=()=>copyText(url,'링크를 복사했습니다.');document.getElementById('qrSave').onclick=()=>{const a=document.createElement('a');a.href=src;a.download=`QR-${x.name.replace(/[\\/:*?"<>|]/g,'')}.gif`;document.body.appendChild(a);a.click();a.remove()}}

// ===== 공유 (휴대폰: 카카오톡 등 공유 창 / PC: 링크 복사) =====
async function shareText(title,text,url){if(navigator.share){try{await navigator.share(url?{title,text:title,url}:{title,text});return}catch(e){if(e.name==='AbortError')return}}copyText(url?`${title}\n${url}`:text,'링크를 복사했습니다.\n카카오톡 대화방에 붙여넣기(Ctrl+V 또는 길게 눌러 붙여넣기) 하세요.')}
function shareItem(x){shareText(x.name,'',siteHref(x.url))}
document.getElementById('shareFolderBtn').onclick=()=>{const sites=lastItems.filter(x=>x.type==='site');if(!sites.length)return;const f=currentFolder();const title=f==='allSites'?'모든 사이트':f==='favorites'?'즐겨찾기':parentName(f);const text=`[${title}] 오늘 사용할 사이트\n\n`+sites.map((x,i)=>`${i+1}. ${x.name}\n${siteHref(x.url)}`).join('\n\n');shareText(title,text)};

// ===== 강의(발표) 모드 =====
const presentBtn=document.getElementById('presentBtn');
function setPresent(on){document.body.classList.toggle('present',on);presentBtn.classList.toggle('on',on);presentBtn.textContent=on?'✖ 강의 모드 끝':'🎤 강의 모드';if(on){if(innerWidth>740)setPane('items');document.documentElement.requestFullscreen?.().catch(()=>{})}else if(document.fullscreenElement)document.exitFullscreen().catch(()=>{})}
presentBtn.onclick=()=>setPresent(!document.body.classList.contains('present'));
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.getElementById('modalRoot').innerHTML){document.getElementById('modalRoot').innerHTML='';return}if(document.body.classList.contains('present'))setPresent(false)}});
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&document.body.classList.contains('present'))setPresent(false)});

// ===== 드래그로 순서 바꾸기·폴더 옮기기 =====
let dragId=null;
function patchFile(x,body){if(x.type==='file')cloudRequest(`/api/files/${encodeURIComponent(x.id)}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).catch(e=>alert(`파일 정보 동기화 실패: ${e.message}`))}
function dropInfo(e){const el=e.target.closest?.('[data-folder],[data-id]');if(!el||!dragId)return null;const fid=el.dataset.folder;if(fid){if(fid==='favorites'||fid==='folder-fav')return{el,kind:'fav'};if(item(fid)?.type==='folder')return{el,kind:'folder',id:fid};return null}const t=item(el.dataset.id);if(!t||t.id===dragId)return null;if(t.id==='folder-fav')return{el,kind:'fav'};if(t.type==='folder')return{el,kind:'folder',id:t.id};if(currentFolder()==='recent')return null;return{el,kind:'before',id:t.id}}
document.addEventListener('dragstart',e=>{const el=e.target.closest?.('[draggable="true"][data-id]');if(!el)return;dragId=el.dataset.id;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/x-shortcut-id',dragId);el.classList.add('dragging')});
document.addEventListener('dragend',()=>{dragId=null;document.querySelectorAll('.dragging,.drop-target,.drop-before').forEach(v=>v.classList.remove('dragging','drop-target','drop-before'))});
document.addEventListener('dragover',e=>{if(!dragId)return;document.querySelectorAll('.drop-target,.drop-before').forEach(v=>v.classList.remove('drop-target','drop-before'));const d=dropInfo(e);if(!d)return;e.preventDefault();e.dataTransfer.dropEffect='move';d.el.classList.add(d.kind==='before'?'drop-before':'drop-target')});
document.addEventListener('drop',e=>{if(!dragId)return;const d=dropInfo(e),x=item(dragId);if(!d||!x)return;e.preventDefault();if(d.kind==='fav'){x.favorite=true;patchFile(x,{favorite:true})}else if(d.kind==='folder'){if(x.parent===d.id)return;x.parent=d.id;patchFile(x,{parent:x.parent})}else{const t=item(d.id),view=currentFolder();data.items.splice(data.items.indexOf(x),1);data.items.splice(data.items.indexOf(t),0,x);if(!['allSites','favorites','recent'].includes(view)&&x.parent!==t.parent){x.parent=t.parent;patchFile(x,{parent:x.parent})}}save()});

// ===== 백업 / 불러오기 =====
document.getElementById('backupBtn').onclick=()=>{const payload={app:'shortcut-explorer',version:1,exportedAt:new Date().toISOString(),items:data.items,recent:data.recent||[]};const blob=new Blob([JSON.stringify(payload,null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`바로가기-백업-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500);setTimeout(()=>alert('백업 파일을 저장했습니다. (다운로드 폴더)\n\n※ 사이트·폴더·메모는 모두 들어 있지만, 파일 보관소에 올린 파일의 실제 내용은 들어 있지 않습니다. 중요한 파일은 따로 내려받아 두세요.'),300)};
document.getElementById('restoreBtn').onclick=()=>document.getElementById('restorePicker').click();
document.getElementById('restorePicker').onchange=async e=>{const f=e.target.files?.[0];e.target.value='';if(!f)return;let j;try{j=JSON.parse(await f.text());if(!Array.isArray(j.items))throw 0}catch{alert('올바른 백업 파일이 아닙니다.');return}const ok=j.items.filter(v=>v&&typeof v.id==='string'&&typeof v.name==='string'&&['site','folder'].includes(v.type)&&(v.type!=='site'||/^https?:\/\//i.test(String(v.url||'')))).map(v=>({id:v.id,name:v.name,type:v.type,parent:typeof v.parent==='string'?v.parent:'root',url:v.type==='site'?String(v.url):undefined,icon:typeof v.icon==='string'?v.icon.slice(0,8):undefined,favorite:!!v.favorite,memo:typeof v.memo==='string'?v.memo:'',system:!!v.system}));if(!ok.length){alert('백업 파일에 불러올 항목이 없습니다.');return}if(!confirm(`백업 파일의 사이트·폴더 ${ok.length}개로 지금 목록을 바꿀까요?\n\n· 파일 보관소의 파일은 그대로 유지됩니다.`))return;const files=data.items.filter(x=>x.type==='file');data.items=ok.concat(files);data.recent=(Array.isArray(j.recent)?j.recent:[]).filter(id=>data.items.some(x=>x.id===id));selectedId=null;selectedFolder='root';nav='allSites';setPane('sites');save();alert('불러오기를 마쳤습니다.')};

// ===== 휴대폰 홈 화면에 추가 =====
(function(){try{const c=document.createElement('canvas');c.width=c.height=192;const g=c.getContext('2d');g.fillStyle='#087bf5';g.beginPath();if(g.roundRect)g.roundRect(0,0,192,192,42);else g.rect(0,0,192,192);g.fill();g.font='108px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('🗂️',96,104);const png=c.toDataURL('image/png');const l=document.createElement('link');l.rel='apple-touch-icon';l.href=png;document.head.appendChild(l);const m={name:'내 바로가기 탐색기',short_name:'바로가기',start_url:location.href.split('#')[0],display:'standalone',background_color:'#f4f6f9',theme_color:'#087bf5',icons:[{src:png,sizes:'192x192',type:'image/png'}]};const ml=document.createElement('link');ml.rel='manifest';ml.href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(m));document.head.appendChild(ml)}catch{}})();
let installPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e});
document.getElementById('installBtn').onclick=async()=>{if(installPrompt){installPrompt.prompt();installPrompt=null;return}const ua=navigator.userAgent,ios=/iphone|ipad|ipod/i.test(ua),samsung=/SamsungBrowser/i.test(ua);const steps=ios?'<ol><li>Safari 아래쪽 가운데 <b>공유 버튼(□↑)</b>을 누릅니다.</li><li>목록을 올려 <b>홈 화면에 추가</b>를 누릅니다.</li><li>오른쪽 위 <b>추가</b>를 누릅니다.</li></ol>':samsung?'<ol><li>삼성 인터넷 아래쪽 <b>≡ 메뉴</b>를 누릅니다.</li><li><b>현재 페이지 추가</b> → <b>홈 화면</b>을 누릅니다.</li><li><b>추가</b>를 누릅니다.</li></ol>':'<ol><li>Chrome 오른쪽 위 <b>⋮ (점 세 개)</b>를 누릅니다.</li><li><b>홈 화면에 추가</b> (또는 <b>앱 설치</b>)를 누릅니다.</li><li><b>추가</b>를 누릅니다.</li></ol>';showInfo('📲 홈 화면에 아이콘 만들기',`<div class="info-body">${steps}<div class="note">휴대폰에서는 이 화면을 인터넷 주소(예: GitHub Pages)로 열었을 때만 홈 화면 아이콘이 제대로 동작합니다. 내려받은 파일을 직접 연 경우에는 안 될 수 있습니다.</div></div>`)};

let touchStart=0;document.getElementById('main').addEventListener('touchstart',e=>touchStart=e.touches[0].clientX,{passive:true});document.getElementById('main').addEventListener('touchend',e=>{if(innerWidth>740)return;let dx=e.changedTouches[0].clientX-touchStart;if(Math.abs(dx)<85)return;const panes=['nav','sites','items','detail'],cur=panes.indexOf(document.getElementById('main').dataset.pane);setPane(panes[Math.max(0,Math.min(3,cur+(dx<0?1:-1)))])},{passive:true});
render();
syncCloudFiles().then(()=>{document.getElementById('storageInfo').textContent='☁️ PC·모바일 동기화 완료';render()}).catch(e=>{document.getElementById('storageInfo').textContent='동기화 연결을 확인해 주세요';console.warn(e)});
})();
</script>
