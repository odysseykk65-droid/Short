<script>
(function(){
var D=JSON.parse(document.getElementById('blob').textContent);
function u8(b){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
function hex(buf){return Array.prototype.map.call(new Uint8Array(buf),function(x){return('0'+x.toString(16)).slice(-2)}).join('');}
function norm(c){return c.toUpperCase().replace(/[^A-Z0-9]/g,'');}
function msg(t){document.getElementById('msg').textContent=t;}
async function tryCode(raw){
 var enc=new TextEncoder();
 var idh=hex(await crypto.subtle.digest('SHA-256',enc.encode('id:'+raw))).slice(0,12);
 var e=D.entries.find(function(x){return x.i===idh});
 if(!e)return null;
 var km=await crypto.subtle.importKey('raw',enc.encode(raw),'PBKDF2',false,['deriveKey']);
 var k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(e.s),iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 var w=u8(e.w);
 var master=await crypto.subtle.decrypt({name:'AES-GCM',iv:w.slice(0,12)},k,w.slice(12));
 var mk=await crypto.subtle.importKey('raw',master,'AES-GCM',false,['decrypt']);
 var p=u8(D.payload);
 var html=await crypto.subtle.decrypt({name:'AES-GCM',iv:p.slice(0,12)},mk,p.slice(12));
 return new TextDecoder().decode(html);
