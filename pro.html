const TE = new TextEncoder(), TD = new TextDecoder();
const B64 = {
  enc(u) { let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); },
  dec(b) { return Uint8Array.from(atob(b), c => c.charCodeAt(0)); }
};
function normCode(c) { return String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }
async function codeId(code) {
  const h = new Uint8Array(await crypto.subtle.digest('SHA-256', TE.encode('shortspro-id:' + normCode(code))));
  return Array.from(h.slice(0, 12), b => b.toString(16).padStart(2, '0')).join('');
}
async function kekFor(code, salt) {
  const base = await crypto.subtle.importKey('raw', TE.encode('shortspro-key:' + normCode(code)), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 300000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function aesEnc(key, bytes) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, bytes));
  return { iv: B64.enc(iv), ct: B64.enc(ct) };
}
async function aesDec(key, o) { return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: B64.dec(o.iv) }, key, B64.dec(o.ct))); }
async function contentKey(b64, use) { return crypto.subtle.importKey('raw', B64.dec(b64), 'AES-GCM', false, use); }
async function streamBytes(bytes, T) { return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new T('gzip'))).arrayBuffer()); }
async function encryptContent(html, kB64) { return aesEnc(await contentKey(kB64, ['encrypt']), await streamBytes(TE.encode(html), CompressionStream)); }
async function decryptContent(data, kB64) { return TD.decode(await streamBytes(await aesDec(await contentKey(kB64, ['decrypt']), data), DecompressionStream)); }
async function makeEntry(code, name, kB64) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const o = await aesEnc(await kekFor(code, salt), TE.encode(JSON.stringify({ k: kB64, n: name })));
  return { id: await codeId(code), s: B64.enc(salt), iv: o.iv, ct: o.ct };
}
async function openEntry(code, e) { return JSON.parse(TD.decode(await aesDec(await kekFor(code, B64.dec(e.s)), e))); }
function newCode() {
  const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', r = crypto.getRandomValues(new Uint8Array(12));
  let c = ''; r.forEach((v, i) => { c += A[v % 32]; if (i % 4 === 3 && i < 11) c += '-'; }); return c;
}
function newKey() { return B64.enc(crypto.getRandomValues(new Uint8Array(32))); }

const $ = id => document.getElementById(id);
function esc(t) { return String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]); }
async function unlock(code, auto) {

  try {

    let html = await decryptContent(DATA, info.k);
    try { localStorage.setItem(LS, normCode(code)); } catch (_) {}
    const badge = '<div style="position:fixed;right:8px;bottom:8px;z-index:9999;background:#5b3fd6;color:#fff;font:900 12px system-ui,sans-serif;padding:6px 11px;border-radius:999px;box-shadow:0 3px 10px rgba(0,0,0,.25);pointer-events:none">⭐ Pro · ' + esc(info.n) + '님 전용</div>';
    html = html.replace(/<\/body>/i, badge + '</body>');
    document.open(); document.write(html); document.close();
  } catch (err) {
    $('go').disabled = false; $('msg').style.color = '#c2410c';
    if (err.message === 'nocode') { try { localStorage.removeItem(LS); } catch (_) {} $('msg').innerText = auto ? '코드를 다시 입력해 주세요.' : '코드가 맞지 않거나 사용이 중지된 코드입니다.'; }

  }
}
